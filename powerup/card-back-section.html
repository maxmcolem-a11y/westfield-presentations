<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<style>
* { box-sizing:border-box; }
html, body { margin:0; min-height:0; background:#fff; color:#172b4d; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; }
#content { display:flex; gap:10px; padding:4px 2px 8px; overflow-x:auto; scrollbar-width:thin; }
.deck { flex:0 0 168px; color:inherit; text-decoration:none; }
.thumb { position:relative; width:168px; height:95px; overflow:hidden; border:1px solid #dfe1e6; border-radius:8px; background:linear-gradient(135deg,#172b4d,#0052cc); box-shadow:0 1px 2px rgba(9,30,66,.12); }
.thumb img { width:100%; height:100%; display:block; object-fit:cover; }
.fallback { position:absolute; inset:0; display:grid; place-items:center; padding:14px; color:#fff; font-size:12px; font-weight:800; letter-spacing:.02em; text-align:center; }
.open { position:absolute; right:6px; bottom:6px; padding:3px 6px; border-radius:5px; background:rgba(9,30,66,.82); color:#fff; font-size:10px; font-weight:700; }
.title { display:block; margin-top:5px; overflow:hidden; color:#172b4d; font-size:12px; font-weight:600; line-height:1.25; text-overflow:ellipsis; white-space:nowrap; }
.deck:hover .thumb { border-color:#579dff; box-shadow:0 0 0 2px rgba(87,157,255,.25); }
.deck:focus-visible { outline:2px solid #0c66e4; outline-offset:2px; border-radius:8px; }
.empty { padding:10px 4px; color:#6b778c; font-size:12px; }
</style>
</head>
<body>
<div id="content" aria-label="Presentation thumbnails"></div>
<script>
var t = TrelloPowerUp.iframe();
var ORIGIN = 'https://maxmcolem-a11y.github.io';
var PREFIX = '/westfield-presentations/';

function governedUrl(raw) {
  try {
    var url = new URL(raw);
    return url.protocol === 'https:' && url.origin === ORIGIN && url.pathname.indexOf(PREFIX) === 0 ? url : null;
  } catch (_) { return null; }
}

function labelFor(attachment, url) {
  if (attachment.name && attachment.name !== attachment.url) return attachment.name;
  var slug = url.pathname.slice(PREFIX.length).replace(/\/?index\.html$/, '').replace(/\/$/, '').split('/').pop();
  return (slug || 'Presentation').replace(/-/g, ' ').replace(/\b\w/g, function(c){ return c.toUpperCase(); });
}

function trelloPreview(attachment) {
  var previews = Array.isArray(attachment.previews) ? attachment.previews : [];
  previews.sort(function(a,b){ return (b.width || 0) - (a.width || 0); });
  return previews[0] && previews[0].url;
}

function absoluteUrl(value, deckUrl) {
  try { return new URL(value, deckUrl).href; } catch (_) { return null; }
}

function metadataThumbnail(deckUrl) {
  return fetch(deckUrl.href, { cache:'no-store' }).then(function(response) {
    if (!response.ok) return null;
    return response.text();
  }).then(function(source) {
    if (!source) return null;
    var doc = new DOMParser().parseFromString(source, 'text/html');
    var node = doc.querySelector('meta[property="og:image"],meta[name="twitter:image"]');
    return node ? absoluteUrl(node.content, deckUrl) : null;
  }).catch(function(){ return null; });
}

function makeTile(attachment) {
  var url = governedUrl(attachment.url);
  if (!url) return null;
  var title = labelFor(attachment, url);
  var link = document.createElement('a');
  link.className = 'deck';
  link.href = url.href;
  link.target = '_blank';
  link.rel = 'noreferrer noopener';
  link.setAttribute('aria-label', 'Open ' + title);

  var thumb = document.createElement('span');
  thumb.className = 'thumb';
  var fallback = document.createElement('span');
  fallback.className = 'fallback';
  fallback.textContent = title;
  var open = document.createElement('span');
  open.className = 'open';
  open.textContent = 'Open ↗';
  thumb.append(fallback, open);

  function showImage(src) {
    if (!src) return;
    var image = document.createElement('img');
    image.alt = '';
    image.loading = 'lazy';
    image.referrerPolicy = 'no-referrer';
    image.addEventListener('load', function(){ thumb.insertBefore(image, fallback); fallback.hidden = true; });
    image.src = src;
  }

  var preview = trelloPreview(attachment);
  if (preview) showImage(preview);
  else metadataThumbnail(url).then(showImage);

  var caption = document.createElement('span');
  caption.className = 'title';
  caption.textContent = title;
  caption.title = title;
  link.append(thumb, caption);
  return link;
}

t.card('attachments').get('attachments').then(function(attachments) {
  var content = document.getElementById('content');
  var tiles = attachments.map(makeTile).filter(Boolean);
  if (!tiles.length) {
    content.innerHTML = '<div class="empty">No presentation links attached.</div>';
  } else {
    tiles.forEach(function(tile){ content.appendChild(tile); });
  }
  t.sizeTo('#content');
});
</script>
</body>
</html>
