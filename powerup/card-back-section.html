<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<style>
* { box-sizing:border-box; }
html, body { margin:0; min-height:0; background:#fff; color:#172b4d; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; }
#content { display:flex; gap:10px; padding:4px 2px 8px; overflow-x:auto; scrollbar-width:thin; }
.deck { flex:0 0 168px; color:inherit; text-decoration:none; }
.thumb { position:relative; display:block; width:168px; height:95px; overflow:hidden; border:1px solid #dfe1e6; border-radius:8px; background:linear-gradient(145deg,#091e42 0%,#0c66e4 100%); box-shadow:0 1px 2px rgba(9,30,66,.12); }
.thumb::before { content:""; position:absolute; width:105px; height:105px; right:-38px; top:-52px; border:1px solid rgba(255,255,255,.22); border-radius:50%; }
.thumb::after { content:""; position:absolute; width:72px; height:72px; right:-24px; top:-31px; border:1px solid rgba(255,255,255,.18); border-radius:50%; }
.fallback { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:flex-end; padding:11px 12px; color:#fff; }
.kind { margin-bottom:4px; color:#b3d4ff; font-size:9px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
.fallback-title { display:-webkit-box; overflow:hidden; font-size:12px; font-weight:750; line-height:1.25; -webkit-box-orient:vertical; -webkit-line-clamp:2; }
.open { position:absolute; right:7px; top:7px; padding:3px 6px; border-radius:5px; background:rgba(9,30,66,.72); color:#fff; font-size:10px; font-weight:700; }
.title { display:block; margin-top:5px; overflow:hidden; color:#172b4d; font-size:12px; font-weight:600; line-height:1.25; text-overflow:ellipsis; white-space:nowrap; }
.deck:hover .thumb { border-color:#579dff; box-shadow:0 0 0 2px rgba(87,157,255,.25); }
.deck:focus-visible { outline:2px solid #0c66e4; outline-offset:2px; border-radius:8px; }
.empty { padding:10px 4px; color:#6b778c; font-size:12px; }
</style>
</head>
<body>
<div id="content" aria-label="Presentation thumbnails"></div>
<script>
var t = TrelloPowerUp.iframe();
var ORIGIN = 'https://maxmcolem-a11y.github.io';
var PREFIX = '/westfield-presentations/';

function governedUrl(raw) {
  try {
    var url = new URL(raw);
    return url.protocol === 'https:' && url.origin === ORIGIN && url.pathname.indexOf(PREFIX) === 0 ? url : null;
  } catch (_) { return null; }
}

function labelFor(attachment, url) {
  if (attachment.name && attachment.name !== attachment.url) return attachment.name;
  var slug = url.pathname.slice(PREFIX.length).replace(/\/?index\.html$/, '').replace(/\/$/, '').split('/').pop();
  return (slug || 'Presentation').replace(/-/g, ' ').replace(/\b\w/g, function(c){ return c.toUpperCase(); });
}

function makeTile(attachment) {
  var url = governedUrl(attachment.url);
  if (!url) return null;
  var title = labelFor(attachment, url);
  var link = document.createElement('a');
  link.className = 'deck';
  link.href = url.href;
  link.target = '_blank';
  link.rel = 'noreferrer noopener';
  link.setAttribute('aria-label', 'Open ' + title);

  var thumb = document.createElement('span');
  thumb.className = 'thumb';
  var fallback = document.createElement('span');
  fallback.className = 'fallback';
  var kind = document.createElement('span');
  kind.className = 'kind';
  kind.textContent = 'Presentation';
  var fallbackTitle = document.createElement('span');
  fallbackTitle.className = 'fallback-title';
  fallbackTitle.textContent = title;
  fallback.append(kind, fallbackTitle);
  var open = document.createElement('span');
  open.className = 'open';
  open.textContent = 'Open ↗';
  thumb.append(fallback, open);

  var caption = document.createElement('span');
  caption.className = 'title';
  caption.textContent = title;
  caption.title = title;
  link.append(thumb, caption);
  return link;
}

t.card('attachments').get('attachments').then(function(attachments) {
  var content = document.getElementById('content');
  var tiles = attachments.map(makeTile).filter(Boolean);
  if (!tiles.length) {
    content.innerHTML = '<div class="empty">No presentation links attached.</div>';
  } else {
    tiles.forEach(function(tile){ content.appendChild(tile); });
  }
  t.sizeTo('#content');
});
</script>
</body>
</html>
