<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<style>
* { box-sizing:border-box; }
html, body { margin:0; min-height:0; background:transparent; color:#172b4d; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; }
#content { display:flex; gap:10px; padding:4px 2px 8px; overflow-x:auto; scrollbar-width:thin; }
.deck { flex:0 0 168px; color:inherit; text-decoration:none; }
.thumb { position:relative; display:block; width:168px; height:95px; overflow:hidden; border-radius:6px; background:transparent; }
.preview { display:block; width:100%; height:100%; object-fit:cover; background:transparent; }
.fallback { position:absolute; inset:0; background:transparent; }
.title { display:block; width:168px; margin-top:6px; color:#172b4d; font-size:12px; font-weight:600; line-height:1.3; overflow-wrap:anywhere; white-space:normal; }
.deck:hover .thumb { box-shadow:0 0 0 2px rgba(87,157,255,.35); }
.deck:focus-visible { outline:2px solid #0c66e4; outline-offset:2px; border-radius:8px; }
.empty { padding:10px 4px; color:#6b778c; font-size:12px; }
</style>
</head>
<body>
<div id="content" aria-label="Presentation thumbnails"></div>
<script>
var t = TrelloPowerUp.iframe();
var ORIGIN = 'https://maxmcolem-a11y.github.io';
var PREFIX = '/westfield-presentations/';

function governedUrl(raw) {
  try {
    var url = new URL(raw);
    return url.protocol === 'https:' && url.origin === ORIGIN && url.pathname.indexOf(PREFIX) === 0 ? url : null;
  } catch (_) { return null; }
}

function labelFor(attachment, url) {
  if (attachment.name && attachment.name !== attachment.url) return attachment.name;
  var slug = url.pathname.slice(PREFIX.length).replace(/\/?index\.html$/, '').replace(/\/$/, '').split('/').pop();
  return (slug || 'Presentation').replace(/-/g, ' ').replace(/\b\w/g, function(c){ return c.toUpperCase(); });
}

function thumbnailUrl(url) {
  var relative = url.pathname.slice(PREFIX.length).replace(/\/?index\.html$/, '').replace(/\.html$/, '').replace(/\/$/, '');
  if (!relative || relative.indexOf('..') !== -1) return null;
  var filename = relative.split('/').map(encodeURIComponent).join('--');
  return ORIGIN + PREFIX + 'powerup/thumbnails/' + filename + '.jpg';
}

function makeTile(attachment) {
  var url = governedUrl(attachment.url);
  if (!url) return null;
  var title = labelFor(attachment, url);
  var link = document.createElement('a');
  link.className = 'deck';
  link.href = url.href;
  link.target = '_blank';
  link.rel = 'noreferrer noopener';
  link.setAttribute('aria-label', 'Open ' + title);

  var thumb = document.createElement('span');
  thumb.className = 'thumb';
  var previewUrl = thumbnailUrl(url);
  var fallback = document.createElement('span');
  fallback.className = 'fallback';
  if (previewUrl) {
    var preview = document.createElement('img');
    preview.className = 'preview';
    preview.src = previewUrl;
    preview.alt = '';
    preview.loading = 'eager';
    preview.addEventListener('load', function(){ fallback.hidden = true; });
    preview.addEventListener('error', function(){ preview.remove(); });
    thumb.append(preview);
  }
  thumb.append(fallback);

  var caption = document.createElement('span');
  caption.className = 'title';
  caption.textContent = title;
  caption.title = title;
  link.append(thumb, caption);
  return link;
}

t.card('attachments').get('attachments').then(function(attachments) {
  var content = document.getElementById('content');
  var tiles = attachments.map(makeTile).filter(Boolean);
  if (!tiles.length) {
    content.innerHTML = '<div class="empty">No presentation links attached.</div>';
  } else {
    tiles.forEach(function(tile){ content.appendChild(tile); });
  }
  t.sizeTo('#content');
});
</script>
</body>
</html>
